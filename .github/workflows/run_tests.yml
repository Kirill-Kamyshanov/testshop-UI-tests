name: Python autotests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: choose tests set
        required: true
        type: choice
        options:
          - smoke
          - regression
          - extended
          - all

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  download-history:
    runs-on: ubuntu-latest
    name: Download history
    steps:
      - name: setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: >
          ARTIFACT_ID=$(curl -L
          -H "Accept: application/vnd.github+json"
          -H "X-GitHub-Api-Version: 2022-11-28"
          "https://api.github.com/repos/Kirill-Kamyshanov/testshop-UI-tests/actions/artifacts?name=allure-results"
          | python -c "import sys, json; print(json.load(sys.stdin)['artifacts'][0]['id'] if json.load(sys.stdin)['artifacts'] else '');")
          &&
          if [ -n "$ARTIFACT_ID" ]; then
            curl -L
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${{ secrets.TOKEN }}"
            -H "X-GitHub-Api-Version: 2022-11-28"
            https://api.github.com/repos/Kirill-Kamyshanov/testshop-UI-tests/actions/artifacts/$ARTIFACT_ID/zip
            -o artifacts.zip
          fi &&
          REPORT_ID=$(curl -L
          -H "Accept: application/vnd.github+json"
          -H "X-GitHub-Api-Version: 2022-11-28"
          "https://api.github.com/repos/Kirill-Kamyshanov/testshop-UI-tests/actions/artifacts?name=github-pages"
          | python -c "import sys, json; print(json.load(sys.stdin)['artifacts'][0]['id'] if json.load(sys.stdin)['artifacts'] else '');")
          &&
          if [ -n "$REPORT_ID" ]; then
            curl -L
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${{ secrets.TOKEN }}"
            -H "X-GitHub-Api-Version: 2022-11-28"
            https://api.github.com/repos/Kirill-Kamyshanov/testshop-UI-tests/actions/artifacts/$REPORT_ID/zip
            -o pages.zip
          fi
      - run: |
          mkdir -p allure-results
          if [ -f artifacts.zip ]; then
            unzip artifacts.zip -d allure-results
          fi
      - run: |
          mkdir -p old_pages pages_history
          if [ -f pages.zip ]; then
            unzip pages.zip -d old_pages
            if [ -f old_pages/artifact.tar ]; then
              tar -xvf old_pages/artifact.tar -C pages_history
            fi
          fi
      - run: |
          if [ -d pages_history/history ]; then
            cp -r pages_history/history/* allure-results/
            cp -r pages_history/history allure-results/
          fi
      - name: Store allure history
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    needs: download-history
    name: run autotests
    steps:
      - name: Checkout autotests
        uses: actions/checkout@v7
      - name: Set up Python environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: run all tests
        if: "github.event.inputs.deployment_target == 'all'"
        run: pytest --alluredir=allure-results
        continue-on-error: true
      - name: run smoke tests
        if: "github.event.inputs.deployment_target == 'smoke'"
        run: pytest -m smoke --alluredir=allure-results
        continue-on-error: true
      - name: run regression tests
        if: "github.event.inputs.deployment_target == 'regression'"
        run: pytest -m regression --alluredir=allure-results
        continue-on-error: true
      - name: run extended tests
        if: "github.event.inputs.deployment_target == 'extended'"
        run: pytest -m extended --alluredir=allure-results
        continue-on-error: true

      - name: Store allure results
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results
          retention-days: 1


  generate-report:
    runs-on: ubuntu-latest
    needs: test
    name: Generate report
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'
      - run: sudo wget https://github.com/allure-framework/allure2/releases/download/2.44.0/allure-2.44.0.tgz && sudo tar -zxvf allure-2.44.0.tgz -C /opt/ && sudo ln -s /opt/allure-2.44.0/bin/allure /usr/bin/allure

      - name: Download history
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: ./allure-results

      - name: Generate report
        run: allure generate -c allure-results -o _site

      - name: Store generated report
        uses: actions/upload-artifact@v7
        with:
          name: _site
          path: _site
          retention-days: 1

  publish-report:
    runs-on: ubuntu-latest
    needs: generate-report
    name: Report publication
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v8
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4